version: '3.9'

services:

  # ──────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE
  # ──────────────────────────────────────────────────────────────────────

  traefik:
    image: traefik:v2.11
    container_name: wams-traefik
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP entry point
      - "8080:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - wams-net

  consul:
    image: consul:1.17
    container_name: wams-consul
    restart: unless-stopped
    command: agent -dev -client=0.0.0.0 -ui
    ports:
      - "8500:8500"   # Consul UI + API
    networks:
      - wams-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: wams-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wams-net

  postgres:
    image: postgres:16-alpine
    container_name: wams-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: auth_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-multiple-db.sql:/docker-entrypoint-initdb.d/init-multiple-db.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - wams-net

  # ──────────────────────────────────────────────────────────────────────
  # MICROSERVICES
  # ──────────────────────────────────────────────────────────────────────

  auth-service:
    build:
      context: ./Authentication_Service
      dockerfile: Dockerfile
    container_name: wams-auth
    restart: unless-stopped
    environment:
      SECRET_KEY: ${AUTH_SECRET_KEY}
      DEBUG: ${DEBUG}
      DB_NAME: ${AUTH_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      CONSUL_HOST: ${CONSUL_HOST}
      CONSUL_PORT: ${CONSUL_PORT}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_NAME: auth-service
      SERVICE_HOST: ${AUTH_SERVICE_HOST}
      SERVICE_PORT: ${AUTH_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - wams-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/auth/`)"
      - "traefik.http.routers.auth.priority=30"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"

  gallery-service:
    build:
      context: ./GalleryImage_Service
      dockerfile: Dockerfile
    container_name: wams-gallery
    restart: unless-stopped
    environment:
      SECRET_KEY: ${GALLERY_SECRET_KEY}
      DEBUG: ${DEBUG}
      DB_NAME: ${GALLERY_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      CONSUL_HOST: ${CONSUL_HOST}
      CONSUL_PORT: ${CONSUL_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
      JWT_SECRET: ${JWT_SECRET}
      SERVICE_NAME: gallery-service
      SERVICE_HOST: ${GALLERY_SERVICE_HOST}
      SERVICE_PORT: ${GALLERY_SERVICE_PORT}
      # Fallback URLs (used if Consul unavailable)
      AUTH_SERVICE_URL: http://auth-service:8000
      AI_SERVICE_URL: http://ai-service:8002
      HISTORIQUE_SERVICE_URL: http://historique-service:8003
    volumes:
      - gallery-media:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
      auth-service:
        condition: service_started
    networks:
      - wams-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gallery.rule=PathPrefix(`/gallery/`)"
      - "traefik.http.routers.gallery.priority=20"
      - "traefik.http.routers.gallery.entrypoints=web"
      - "traefik.http.services.gallery.loadbalancer.server.port=8001"

  ai-service:
    build:
      context: ./smart_preprocessing_service
      dockerfile: Dockerfile
    container_name: wams-ai
    restart: unless-stopped
    environment:
      SECRET_KEY: ${AI_SECRET_KEY}
      DEBUG: ${DEBUG}
      DB_NAME: ${AI_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      CONSUL_HOST: ${CONSUL_HOST}
      CONSUL_PORT: ${CONSUL_PORT}
      SERVICE_NAME: ai-service
      SERVICE_HOST: ${AI_SERVICE_HOST}
      SERVICE_PORT: ${AI_SERVICE_PORT}
    volumes:
      - ./smart_preprocessing_service/ai_engine/models:/app/ai_engine/models
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - wams-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/api/`)"
      - "traefik.http.routers.ai.priority=10"
      - "traefik.http.routers.ai.entrypoints=web"
      - "traefik.http.services.ai.loadbalancer.server.port=8002"

  historique-service:
    build:
      context: ./Historique_Service
      dockerfile: Dockerfile
    container_name: wams-historique
    restart: unless-stopped
    environment:
      SECRET_KEY: ${HISTORIQUE_SECRET_KEY}
      DEBUG: ${DEBUG}
      DB_NAME: ${HISTORIQUE_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      CONSUL_HOST: ${CONSUL_HOST}
      CONSUL_PORT: ${CONSUL_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
      SERVICE_NAME: historique-service
      SERVICE_HOST: ${HISTORIQUE_SERVICE_HOST}
      SERVICE_PORT: ${HISTORIQUE_SERVICE_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      consul:
        condition: service_started
    networks:
      - wams-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.historique.rule=PathPrefix(`/api/history/`)"
      - "traefik.http.routers.historique.priority=30"
      - "traefik.http.routers.historique.entrypoints=web"
      - "traefik.http.services.historique.loadbalancer.server.port=8003"

  historique-consumer:
    build:
      context: ./Historique_Service
      dockerfile: Dockerfile
    container_name: wams-historique-consumer
    restart: unless-stopped
    command: python manage.py run_consumer
    environment:
      SECRET_KEY: ${HISTORIQUE_SECRET_KEY}
      DEBUG: ${DEBUG}
      DB_NAME: ${HISTORIQUE_DB_NAME}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT}
      RABBITMQ_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASS: ${RABBITMQ_DEFAULT_PASS}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      historique-service:
        condition: service_started
    networks:
      - wams-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wams-frontend
    restart: unless-stopped
    networks:
      - wams-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

networks:
  wams-net:
    driver: bridge

volumes:
  postgres-data:
  gallery-media:
